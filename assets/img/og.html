<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: Inter, Arial, sans-serif; }
  .canvas {
    width: 1200px; height: 630px;
    background: #0C2340;
    position: relative;
    display: flex; flex-direction: column; justify-content: center;
    padding: 90px 100px;
  }
  .canvas::before {
    content: "";
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 70% 80% at 85% 20%, black 20%, transparent 70%);
  }
  .ring {
    position: absolute; right: -140px; top: -140px;
    width: 460px; height: 460px; border-radius: 50%;
    border: 1.5px solid rgba(198,161,91,0.4);
  }
  .ring2 {
    position: absolute; right: -60px; top: -60px;
    width: 300px; height: 300px; border-radius: 50%;
    border: 1px solid rgba(198,161,91,0.25);
  }
  .seal { position: relative; margin-bottom: 44px; }
  .seal svg { width: 96px; height: 96px; }
  h1 {
    position: relative;
    font-family: "Source Serif 4", Georgia, serif;
    font-weight: 600; font-size: 64px; line-height: 1.12;
    color: #FAF8F4; max-width: 880px; letter-spacing: -0.5px;
    margin-bottom: 30px;
  }
  .rule { width: 88px; height: 4px; background: #C6A15B; position: relative; margin-bottom: 30px; }
  .domains {
    position: relative;
    font-size: 19px; font-weight: 500; letter-spacing: 3.5px;
    text-transform: uppercase; color: #8FA0BC;
  }
  .domains b { color: #C6A15B; font-weight: 500; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="ring"></div>
    <div class="ring2"></div>
    <div class="seal">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#C6A15B" stroke-width="2"/>
        <circle cx="32" cy="32" r="25" fill="none" stroke="#C6A15B" stroke-width="1" opacity="0.55"/>
        <text x="32" y="43" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#C6A15B">A</text>
      </svg>
    </div>
    <h1>Know where your exposure is before it costs you.</h1>
    <div class="rule"></div>
    <div class="domains">Risk Governance <b>·</b> Forensic Audit <b>·</b> Trade Finance <b>·</b> Logistics &amp; Aviation</div>
  </div>
</body>
</html>
